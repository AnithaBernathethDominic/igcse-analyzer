<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IGCSE CS Practice</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink:    #0f1117; --paper: #faf9f6; --cream: #f0ede6;
  --accent: #1a56db; --accent2:#0e9f6e; --danger:#e02424;
  --warn:   #d97706; --border:#d4cfc6;  --muted: #6b6760;
  --card:   #ffffff;
  --shadow: 0 2px 12px rgba(0,0,0,.07), 0 1px 3px rgba(0,0,0,.05);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}

/* HEADER */
header{background:var(--ink);color:#fff;display:flex;align-items:center;
  justify-content:space-between;padding:0 28px;height:54px;position:sticky;top:0;z-index:200}
.logo{font-family:'DM Serif Display',serif;font-size:1.2rem}
.logo span{color:#60a5fa}
.badge{font-size:.68rem;font-weight:600;letter-spacing:.08em;background:#60a5fa22;
  color:#93c5fd;border:1px solid #3b82f620;padding:2px 8px;border-radius:100px;text-transform:uppercase}

/* SHELL */
.shell{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 54px)}

/* SIDEBAR */
aside{background:var(--cream);border-right:1px solid var(--border);
  padding:20px 0;overflow-y:auto;position:sticky;top:54px;height:calc(100vh - 54px)}
.sidebar-title{font-size:.62rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);padding:0 18px 10px}
.topic-item{display:flex;align-items:center;gap:9px;padding:9px 18px;cursor:pointer;
  border-left:3px solid transparent;transition:all .15s;font-size:.88rem;color:var(--ink);user-select:none}
.topic-item:hover{background:#e8e3dc;border-left-color:var(--border)}
.topic-item.active{background:var(--card);border-left-color:var(--accent);
  color:var(--accent);font-weight:600}
.topic-dot{width:8px;height:8px;border-radius:50%;background:var(--border);flex-shrink:0}
.topic-item.active .topic-dot{background:var(--accent)}
.topic-count{margin-left:auto;font-size:.7rem;font-weight:600;background:var(--border);
  color:var(--muted);padding:1px 7px;border-radius:100px;min-width:22px;text-align:center}
.topic-item.active .topic-count{background:#dbeafe;color:var(--accent)}
.sidebar-loading{padding:10px 18px;font-size:.85rem;color:var(--muted);font-style:italic}

/* MAIN */
main{padding:28px 32px;display:flex;flex-direction:column;gap:18px;min-width:0}

/* TABS */
.tab-bar{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:4px}
.tab{padding:8px 20px;font-size:.85rem;font-weight:600;cursor:pointer;
  border-bottom:3px solid transparent;margin-bottom:-2px;color:var(--muted);transition:all .15s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab:hover:not(.active){color:var(--ink)}

/* EMPTY STATE */
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;color:var(--muted);padding:80px 0;text-align:center}
.empty-icon{font-size:3rem;opacity:.4}
.empty-state h3{font-family:'DM Serif Display',serif;font-size:1.4rem;opacity:.5}

/* PROGRESS */
.progress-wrap{display:flex;align-items:center;gap:12px}
.progress-label{font-size:.78rem;font-weight:600;color:var(--muted);white-space:nowrap}
.progress-bar{flex:1;height:5px;background:var(--border);border-radius:100px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:100px;transition:width .4s ease}

/* QUESTION CARD */
.q-card{background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:22px 26px;box-shadow:var(--shadow);animation:fadeUp .22s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.q-meta{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.q-tag{font-family:'DM Mono',monospace;font-size:.7rem;font-weight:500;
  background:#f0f4ff;color:var(--accent);border:1px solid #bfdbfe;padding:3px 9px;border-radius:6px}
.q-topic-tag{font-size:.7rem;font-weight:500;background:var(--cream);color:var(--muted);
  border:1px solid var(--border);padding:3px 9px;border-radius:6px;max-width:260px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-text{font-size:.97rem;line-height:1.65;white-space:pre-wrap}

/* ANSWER */
textarea{width:100%;min-height:100px;padding:12px 14px;font-family:'DM Sans',sans-serif;
  font-size:.93rem;line-height:1.6;background:var(--card);border:1.5px solid var(--border);
  border-radius:10px;resize:vertical;color:var(--ink);transition:border-color .15s;outline:none}
textarea:focus{border-color:var(--accent)}
textarea::placeholder{color:#b5b0a8}
.answer-area{display:flex;flex-direction:column;gap:10px}
.mcq-options{display:none;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.mcq-options.visible{display:grid}
.mcq-option{display:flex;align-items:flex-start;gap:10px;text-align:left;background:var(--card);
  border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;cursor:pointer;
  font-family:'DM Sans',sans-serif;font-size:.92rem;line-height:1.45;color:var(--ink)}
.mcq-option:hover{border-color:var(--accent);background:#f8fbff}
.mcq-option.selected{border-color:var(--accent);background:#eef4ff;box-shadow:0 0 0 2px #bfdbfe}
.mcq-letter{font-family:'DM Mono',monospace;font-weight:700;color:var(--accent);min-width:22px}
.visual-note{display:none;font-size:.78rem;line-height:1.55;color:var(--muted);
  background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:8px 10px;margin-top:12px}
.visual-note.visible{display:block}
.q-text strong{font-weight:700}

/* BUTTONS */
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 18px;
  font-family:'DM Sans',sans-serif;font-size:.86rem;font-weight:600;
  border:none;border-radius:8px;cursor:pointer;transition:all .15s;user-select:none}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#1e40af}
.btn-ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--border)}
.btn-ghost:hover{background:var(--cream)}
.btn-ghost:disabled{opacity:.4;cursor:not-allowed}
.btn-nav{background:var(--cream);color:var(--ink);border:1.5px solid var(--border);padding:8px 14px}
.btn-nav:hover:not(:disabled){background:#e0dbd3}
.btn-nav:disabled{opacity:.35;cursor:not-allowed}

/* MODEL ANSWER */
.model-answer{font-size:.88rem;line-height:1.7;padding:12px 16px;
  background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;display:none;white-space:pre-wrap}
.model-answer.visible{display:block}

/* FEEDBACK CARD */
.feedback-card{background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:18px 22px;box-shadow:var(--shadow);display:none;flex-direction:column;gap:12px;
  animation:fadeUp .2s ease}
.feedback-card.visible{display:flex}
.score-row{display:flex;align-items:center;gap:14px}
.score-circle{width:54px;height:54px;border-radius:50%;border:3px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;
  font-size:1.2rem;flex-shrink:0;transition:border-color .3s}
.score-circle.good{border-color:var(--accent2);color:var(--accent2)}
.score-circle.mid{border-color:var(--warn);color:var(--warn)}
.score-circle.low{border-color:var(--danger);color:var(--danger)}
.score-text h4{font-size:.93rem;font-weight:600;margin-bottom:2px}
.score-text p{font-size:.8rem;color:var(--muted)}
.divider{height:1px;background:var(--border)}
.fb-label{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin-bottom:5px}
.highlighted-answer{font-size:.88rem;line-height:1.7;padding:9px 13px;
  background:var(--cream);border-radius:8px}
.fb-block{padding:11px 14px;border-radius:8px;background:#f8fafc;border:1px solid var(--border)}
.fb-block.fb-good{background:#f0fdf4;border-color:#bbf7d0}
.fb-block.fb-good .fb-label{color:#065f46}
.fb-block.fb-improve{background:#fffbeb;border-color:#fde68a}
.fb-block.fb-improve .fb-label{color:#92400e}
.fb-text{font-size:.88rem;line-height:1.65;margin-top:4px}
.pill-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.pill{font-size:.76rem;font-weight:500;padding:2px 9px;border-radius:100px}
.pill-hit{background:#d1fae5;color:#065f46}
.pill-miss{background:#fee2e2;color:var(--danger)}

/* QUESTION GRID (All Questions view) */
.grid-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.grid-title{font-family:'DM Serif Display',serif;font-size:1.1rem}
.grid-sub{font-size:.8rem;color:var(--muted)}
.q-grid{display:grid;gap:10px}
.q-grid-card{background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:14px 16px;cursor:pointer;transition:all .15s;box-shadow:var(--shadow)}
.q-grid-card:hover{border-color:var(--accent);background:#f0f4ff}
.qgc-meta{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.qgc-num{font-family:'DM Mono',monospace;font-size:.68rem;font-weight:600;
  background:#f0f4ff;color:var(--accent);border:1px solid #bfdbfe;padding:2px 7px;border-radius:5px}
.qgc-topic{font-size:.68rem;color:var(--muted);background:var(--cream);
  border:1px solid var(--border);padding:2px 7px;border-radius:5px}
.qgc-text{font-size:.85rem;line-height:1.5;color:var(--ink);display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qgc-ans{font-size:.75rem;color:var(--muted);margin-top:5px;font-style:italic;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}

@media(max-width:680px){
  .shell{grid-template-columns:1fr}
  aside{position:static;height:auto;max-height:200px;border-right:none;border-bottom:1px solid var(--border)}
  main{padding:16px 14px}
}
</style>
</head>
<body>
<header>
  <div class="logo">IGCSE <span>CS</span> Practice</div>
  <div class="badge">0478 · Paper 1</div>
</header>

<div class="shell">
  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="sidebar-title">Topics</div>
    <div class="sidebar-loading">Loading topics…</div>
  </aside>

  <!-- MAIN -->
  <main id="main">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">📚</div>
      <h3>Select a topic</h3>
      <p>Choose a topic from the sidebar to start practising</p>
    </div>

    <!-- Practice area -->
    <div id="practiceArea" style="display:none;flex-direction:column;gap:18px">

      <!-- Tab bar -->
      <div class="tab-bar">
        <div class="tab active" id="tabPractice" onclick="switchTab('practice')">✏️ Practice</div>
        <div class="tab"        id="tabAll"      onclick="switchTab('all')">📋 All Questions</div>
      </div>

      <!-- ===== PRACTICE TAB ===== -->
      <div id="panelPractice">
        <!-- Progress -->
        <div class="progress-wrap" style="margin-bottom:6px">
          <span class="progress-label" id="progressLabel">0 / 0</span>
          <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
        </div>

        <!-- Question card -->
        <div class="q-card" id="qCard">
          <div class="q-meta">
            <span class="q-tag"      id="qTag">Q—</span>
            <span class="q-topic-tag" id="qTopicTag">—</span>
          </div>
          <div class="q-text" id="qText">—</div>
          <div class="visual-note" id="visualNote"></div>
        </div>

        <!-- Answer -->
        <div class="answer-area">
          <div class="mcq-options" id="mcqOptions"></div>
          <textarea id="studentAnswer" placeholder="Write your answer here…"></textarea>
        </div>

        <!-- Buttons -->
        <div class="btn-row">
          <button class="btn btn-primary" id="checkBtn" onclick="checkAnswer(event)">✓ Check Answer</button>
          <button class="btn btn-ghost"   onclick="toggleModel()">👁 Show Answer</button>
          <div style="flex:1"></div>
          <button class="btn btn-nav" id="prevBtn" onclick="prevQuestion()" disabled>← Prev</button>
          <button class="btn btn-nav" id="nextBtn" onclick="nextQuestion()">Next →</button>
        </div>

        <!-- Model answer -->
        <div class="model-answer" id="modelAnswer"></div>

        <!-- Feedback -->
        <div class="feedback-card" id="feedbackCard">
          <div class="score-row">
            <div class="score-circle" id="scoreCircle">—</div>
            <div class="score-text">
              <h4 id="scoreSubtext">—</h4>
            </div>
          </div>
          <div class="divider"></div>
          <div>
            <div class="fb-label">Your Answer</div>
            <div class="highlighted-answer" id="highlightedAnswer"></div>
          </div>
          <div class="divider"></div>
          <div class="fb-block" id="examinerCommentWrap">
            <div class="fb-label">📋 Examiner Comment</div>
            <div class="fb-text" id="examinerComment"></div>
          </div>
          <div class="fb-block fb-good" id="whatWasGoodWrap">
            <div class="fb-label">✅ What Was Good</div>
            <div class="fb-text" id="whatWasGood"></div>
          </div>
          <div class="fb-block fb-improve" id="howToImproveWrap">
            <div class="fb-label">💡 How To Improve</div>
            <div class="fb-text" id="howToImprove"></div>
          </div>
          <div id="matchedWrap">
            <div class="fb-label">Keywords Matched</div>
            <div class="pill-row" id="matchedPills"></div>
          </div>
          <div id="missingWrap">
            <div class="fb-label">Keywords Missing</div>
            <div class="pill-row" id="missingPills"></div>
          </div>
        </div>
      </div><!-- /panelPractice -->

      <!-- ===== ALL QUESTIONS TAB ===== -->
      <div id="panelAll" style="display:none">
        <div class="grid-header" style="margin-bottom:12px">
          <div>
            <div class="grid-title" id="gridTitle">All Questions</div>
            <div class="grid-sub"   id="gridSub"></div>
          </div>
        </div>
        <div class="q-grid" id="qGrid"></div>
      </div>

    </div><!-- /practiceArea -->
  </main>
</div>

<script>
// ---- STATE ----
let questions    = [];
let current      = 0;
let modelShown   = false;
let activeTab    = 'practice';
let activeTopic  = '';
let selectedMcq  = '';

const DOT_COLORS = [
  '#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6',
  '#ec4899','#06b6d4','#84cc16','#f97316','#6366f1',
  '#14b8a6','#a855f7','#f43f5e','#0ea5e9','#22c55e'
];

function escapeHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function stripQuestionPrefix(text) {
  return String(text || '').replace(/^\([a-h]\)\s*/,'').replace(/^\([ivx]+\)\s*/,'').trim();
}

function detectMcq(text) {
  const source = stripQuestionPrefix(text).replace(/\s+/g, ' ').trim();
  const optionRegex = /(?:^|\s)([A-D])\s+(.+?)(?=\s+[A-D]\s+|$)/g;
  const options = [];
  let match;
  while ((match = optionRegex.exec(source)) !== null) {
    const value = match[2].trim();
    if (value && value.length <= 80) options.push({letter: match[1], text: value});
  }
  const hasPrompt = /\b(tick|circle|choose|select)\b/i.test(source);
  const hasEnoughOptions = options.length >= 2;
  if (!hasPrompt || !hasEnoughOptions) return null;

  const firstMarker = source.search(/(?:^|\s)A\s+/);
  const prompt = firstMarker >= 0 ? source.slice(0, firstMarker).trim() : source;
  return {prompt, options};
}

function formatQuestionHtml(text, mcq) {
  let source = stripQuestionPrefix(text);
  if (mcq) source = mcq.prompt;
  source = source
    .replace(/\b(Term)\s+(Description|Definition)\b/gi, '\n\n$1 | $2\n')
    .replace(/\b(character set|sample rate|pixel|resolution|colour depth|color depth|bit depth|metadata|header)\b/gi, '\n$1')
    .replace(/\b(This is|It is|This stores|The number)\b/g, '\n$1')
    .replace(/\s*\/\/\s*/g, '\nOR ')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
  return escapeHtml(source);
}

function formatAnswerText(answer) {
  return String(answer || 'No model answer available.')
    .replace(/\b(Term)\s+(Description|Definition)\b/gi, '$1 | $2\n')
    .replace(/\b(character set|sample rate|pixel|resolution|colour depth|color depth|bit depth|metadata|header)\b/gi, '\n$1')
    .replace(/\b(This is|It is|This stores|The number)\b/g, '\n$1')
    .replace(/\s*\/\/\s*/g, '\nOR ')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

function shouldShowVisualNote(text) {
  return /\b(image|diagram|figure|picture|table|boxes?|tick)\b/i.test(text || '');
}

// ---- BOOT ----
async function boot() {
  try {
    const res  = await fetch('/topics/with-counts');
    const data = await res.json();
    renderSidebar(data);
  } catch(e) {
    // fallback: simple topics list
    try {
      const res  = await fetch('/topics');
      const data = await res.json();
      renderSidebar(data.map(t => ({topic:t, count:''})));
    } catch(_) {
      document.getElementById('sidebar').innerHTML =
        '<div class="sidebar-title">Topics</div>' +
        '<div class="sidebar-loading">Could not load topics.</div>';
    }
  }
}

function renderSidebar(topicData) {
  const aside = document.getElementById('sidebar');
  aside.innerHTML = '<div class="sidebar-title">Topics</div>';
  if (!topicData.length) {
    aside.innerHTML += '<div class="sidebar-loading">No topics found. Upload a paper first.</div>';
    return;
  }
  topicData.forEach((item, idx) => {
    const t = item.topic || item;
    const c = item.count || '';
    const el = document.createElement('div');
    el.className   = 'topic-item';
    el.dataset.topic = t;

    const dot = document.createElement('div');
    dot.className  = 'topic-dot';
    dot.style.background = DOT_COLORS[idx % DOT_COLORS.length];

    const name = document.createElement('span');
    name.textContent = t;

    const badge = document.createElement('span');
    badge.className   = 'topic-count';
    badge.id          = `cnt-${idx}`;
    badge.textContent = c;

    el.appendChild(dot);
    el.appendChild(name);
    el.appendChild(badge);
    el.onclick = () => selectTopic(t, el, `cnt-${idx}`);
    aside.appendChild(el);
  });
}

// ---- SELECT TOPIC ----
async function selectTopic(topic, el, countId) {
  document.querySelectorAll('.topic-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
  activeTopic = topic;

  const res  = await fetch(`/practice/${encodeURIComponent(topic)}`);
  questions  = await res.json();
  current    = 0;
  modelShown = false;

  // Update count badge
  const cEl = document.getElementById(countId);
  if (cEl) cEl.textContent = questions.length;

  if (!questions.length) {
    showEmpty('No questions found for this topic.');
    return;
  }

  showPracticeArea();
  switchTab(activeTab === 'all' ? 'all' : 'practice');
}

function showPracticeArea() {
  document.getElementById('emptyState').style.display    = 'none';
  document.getElementById('practiceArea').style.display  = 'flex';
}
function showEmpty(msg) {
  document.getElementById('practiceArea').style.display  = 'none';
  document.getElementById('emptyState').style.display    = 'flex';
  document.querySelector('#emptyState p').textContent    = msg || 'Pick a topic';
}

// ---- TABS ----
function switchTab(tab) {
  activeTab = tab;
  document.getElementById('tabPractice').classList.toggle('active', tab==='practice');
  document.getElementById('tabAll').classList.toggle('active',      tab==='all');
  document.getElementById('panelPractice').style.display = tab==='practice' ? 'flex' : 'none';
  document.getElementById('panelPractice').style.flexDirection = 'column';
  document.getElementById('panelPractice').style.gap = '18px';
  document.getElementById('panelAll').style.display      = tab==='all'      ? 'block' : 'none';

  if (tab === 'practice') {
    renderQuestion();
  } else {
    renderGrid();
  }
}

// ---- RENDER QUESTION (Practice tab) ----
function renderQuestion() {
  if (!questions.length) return;
  const q   = questions[current];
  const rawText = q.question_text || '';
  const mcq = detectMcq(rawText);

  document.getElementById('qTag').textContent      = q.question_no || q.question || '—';
  document.getElementById('qTopicTag').textContent = q.topic       || '—';
  document.getElementById('qText').innerHTML       = formatQuestionHtml(rawText, mcq);

  const visualNote = document.getElementById('visualNote');
  if (shouldShowVisualNote(rawText)) {
    visualNote.textContent = mcq
      ? 'Multiple-choice question: choose one option below.'
      : 'This question was extracted from a PDF, so any original diagram/table image may appear as formatted text here.';
    visualNote.classList.add('visible');
  } else {
    visualNote.classList.remove('visible');
    visualNote.textContent = '';
  }

  selectedMcq = '';
  const mcqOptions = document.getElementById('mcqOptions');
  const answerBox = document.getElementById('studentAnswer');
  mcqOptions.innerHTML = '';
  if (mcq) {
    mcq.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'mcq-option';
      btn.innerHTML = `<span class="mcq-letter">${escapeHtml(opt.letter)}</span><span>${escapeHtml(opt.text)}</span>`;
      btn.onclick = () => {
        selectedMcq = opt.letter;
        answerBox.value = opt.letter;
        document.querySelectorAll('.mcq-option').forEach(item => item.classList.remove('selected'));
        btn.classList.add('selected');
      };
      mcqOptions.appendChild(btn);
    });
    mcqOptions.classList.add('visible');
    answerBox.style.display = 'none';
    answerBox.value = '';
  } else {
    mcqOptions.classList.remove('visible');
    answerBox.style.display = 'block';
    answerBox.value = '';
  }

  const pct = (current / questions.length) * 100;
  document.getElementById('progressLabel').textContent = `${current+1} / ${questions.length}`;
  document.getElementById('progressFill').style.width  = pct + '%';

  // Prev / Next button states
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === questions.length - 1;
  document.getElementById('nextBtn').textContent = current === questions.length - 1 ? 'Done ✓' : 'Next →';

  // Reset UI
  document.getElementById('feedbackCard').classList.remove('visible');
  document.getElementById('modelAnswer').classList.remove('visible');
  document.getElementById('modelAnswer').textContent = '';
  modelShown = false;
}

// ---- NAVIGATION ----
function prevQuestion() {
  if (current > 0) {
    current--;
    renderQuestion();
  }
}

function nextQuestion() {
  if (current < questions.length - 1) {
    current++;
    renderQuestion();
  } else {
    // Last question — show completion
    document.getElementById('qText').textContent      = '🎉 You\'ve completed all questions in this topic!';
    document.getElementById('qTag').textContent       = 'Done';
    document.getElementById('studentAnswer').value    = '';
    document.getElementById('studentAnswer').style.display = 'none';
    document.getElementById('mcqOptions').classList.remove('visible');
    document.getElementById('visualNote').classList.remove('visible');
    document.getElementById('feedbackCard').classList.remove('visible');
    document.getElementById('progressFill').style.width = '100%';
    document.getElementById('progressLabel').textContent = `${questions.length} / ${questions.length}`;
    document.getElementById('nextBtn').disabled = true;
  }
}

// ---- TOGGLE MODEL ANSWER ----
function toggleModel() {
  const ma = document.getElementById('modelAnswer');
  if (modelShown) {
    ma.classList.remove('visible'); modelShown = false;
  } else {
    ma.textContent = formatAnswerText(questions[current]?.answer);
    ma.classList.add('visible');    modelShown = true;
  }
}

// ---- CHECK ANSWER ----
async function checkAnswer(evt) {
  const q             = questions[current];
  const correct       = q.answer        || '';
  const question_text = q.question_text || '';
  const mcq           = detectMcq(question_text);
  const student       = (mcq ? selectedMcq : document.getElementById('studentAnswer').value).trim();
  if (!student) {
    if (!mcq) document.getElementById('studentAnswer').focus();
    return;
  }

  const btn = document.getElementById('checkBtn');
  btn.disabled = true; btn.textContent = '⏳ Marking…';
  showLoadingFeedback();

  try {
    const res  = await fetch('/feedback', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({student, correct, question_text})
    });
    const data = await res.json();
    renderFeedback(data, student);
  } catch(e) {
    document.getElementById('feedbackCard').classList.remove('visible');
    alert('Server error — please try again.');
  } finally {
    btn.disabled = false; btn.textContent = '✓ Check Answer';
  }
}

function showLoadingFeedback() {
  const card = document.getElementById('feedbackCard');
  card.classList.add('visible');
  document.getElementById('scoreCircle').textContent    = '…';
  document.getElementById('scoreCircle').className      = 'score-circle';
  document.getElementById('scoreSubtext').textContent   = 'AI examiner is marking…';
  document.getElementById('highlightedAnswer').innerHTML= '<span style="color:#aaa;font-style:italic">Analysing…</span>';
  document.getElementById('examinerComment').textContent = '';
  document.getElementById('whatWasGood').textContent     = '';
  document.getElementById('howToImprove').textContent    = '';
  ['examinerCommentWrap','whatWasGoodWrap','howToImproveWrap','missingWrap','matchedWrap']
    .forEach(id => document.getElementById(id).style.display = 'none');
  document.getElementById('missingPills').innerHTML = '';
  document.getElementById('matchedPills').innerHTML = '';
}

function renderFeedback(data, studentRaw) {
  const parts  = (data.marks || '0/4').split('/');
  const scored = parseInt(parts[0]) || 0;
  const total  = parseInt(parts[1]) || 4;
  const ratio  = total > 0 ? scored / total : 0;

  const circle = document.getElementById('scoreCircle');
  circle.textContent = data.marks || '—';
  circle.className   = 'score-circle ' + (ratio>=1?'good':ratio>=.5?'mid':'low');

  document.getElementById('scoreSubtext').textContent =
    scored===total ? 'Full marks — excellent!' :
    scored===0     ? 'No marks — keep revising' :
    `${scored} of ${total} marks earned`;

  document.getElementById('highlightedAnswer').innerHTML =
    data.highlighted || esc(studentRaw);

  // Examiner sections
  const ec = data.examiner_comment || data.comment || '';
  const wg = data.what_was_good    || '';
  const hi = data.how_to_improve   || '';

  set('examinerComment', ec, 'examinerCommentWrap', true);
  set('whatWasGood',     wg, 'whatWasGoodWrap',
      !!wg && !wg.toLowerCase().includes('no creditworthy'));
  set('howToImprove',    hi, 'howToImproveWrap', !!hi && ratio < 1);

  // Pills
  renderPills('matchedPills','matchedWrap', data.matched||[], 'pill-hit');
  renderPills('missingPills','missingWrap', data.missing||[], 'pill-miss');

  document.getElementById('feedbackCard').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function set(textId, text, wrapId, show) {
  document.getElementById(textId).textContent            = text;
  document.getElementById(wrapId).style.display          = show ? 'block' : 'none';
}
function renderPills(pillsId, wrapId, words, cls) {
  const cont = document.getElementById(pillsId);
  cont.innerHTML = '';
  words.slice(0,6).forEach(w => {
    const p = document.createElement('span');
    p.className = 'pill '+cls; p.textContent = w; cont.appendChild(p);
  });
  document.getElementById(wrapId).style.display = words.length ? 'block' : 'none';
}
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

// ---- RENDER QUESTION GRID (All Questions tab) ----
function renderGrid() {
  const grid = document.getElementById('qGrid');
  grid.innerHTML = '';
  document.getElementById('gridTitle').textContent = activeTopic || 'All Questions';
  document.getElementById('gridSub').textContent   = `${questions.length} question${questions.length!==1?'s':''}`;

  questions.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'q-grid-card';

    const meta = document.createElement('div');
    meta.className = 'qgc-meta';

    const num = document.createElement('span');
    num.className   = 'qgc-num';
    num.textContent = q.question_no || q.question || `Q${idx+1}`;

    const topic = document.createElement('span');
    topic.className   = 'qgc-topic';
    topic.textContent = (q.topic||'').split(' - ')[1] || q.topic || '';

    meta.appendChild(num);
    meta.appendChild(topic);

    const txt = document.createElement('div');
    txt.className   = 'qgc-text';
    txt.textContent = (q.question_text||'').replace(/^\[Question \d+ context[^\]]*\]\n?/,'')
                        .replace(/^\([a-h]\)\s*/,'').trim();

    const ans = document.createElement('div');
    ans.className   = 'qgc-ans';
    ans.textContent = q.answer ? `Answer: ${q.answer.slice(0,100)}…` : 'No answer stored';

    card.appendChild(meta);
    card.appendChild(txt);
    card.appendChild(ans);

    // Click → jump to this question in Practice tab
    card.onclick = () => {
      current = idx;
      switchTab('practice');
    };

    grid.appendChild(card);
  });
}

boot();
</script>
